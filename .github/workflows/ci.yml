name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm desktop:package
      - run: pnpm --filter @retailos/api package:cpanel
      - run: pnpm --filter @retailos/web package:cpanel
      - uses: actions/upload-artifact@v4
        with:
          name: karyana-shop-windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
